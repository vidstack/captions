<!doctype html>
<html>
  <head>
    <title>Media Captions Sandbox</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles/captions.css" />
    <link rel="stylesheet" href="/styles/regions.css" />
    <script type="module" src="/.sandbox/main.ts"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      .viewport {
        position: relative;
        width: 960px;
        height: 540px;
        overflow: hidden;
        border-radius: 8px;
        background: linear-gradient(160deg, #4a5a7a 0%, #2b3550 45%, #151826 100%);
        box-sizing: border-box;
      }

      .viewport.small {
        width: 464px;
        height: 261px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 464px);
        gap: 16px;
      }

      .grid [data-part='captions'] {
        --cue-font-size: 9cqh;
      }

      .label {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 4px 8px;
        font-size: 13px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
        z-index: 2;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .controls a {
        color: #9cc4ff;
      }

      /* Karaoke styling for the demo: sung words are highlighted. */
      [data-part='timed'][data-past] {
        color: #ffd166;
      }

      [data-part='timed'][data-future] {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="controls">
      <label>
        Time
        <input id="current-time" type="number" value="3" step="0.5" style="width: 80px" />
      </label>
      <span id="links"></span>
    </div>
  </body>
</html>
